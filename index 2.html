function calc(){

  const luc=rec-ctot, mm=ctot>0?Math.pow(rec/ctot,30/dias)-1:0, pmax=rec/Math.pow(1+D.mm,dias/30)-oper, maxBase=(pmax-cf.frete)/(1+cf.com);

  else verd=`<div class="verd ok"><b>Compra boa.</b> ${leil?'Lance de':'Pedem'} ${pago} e você pode ${leil?'ir até':'pagar até'} ${maxp}. Rende ${pct(mm,2)} ao mês.</div>`;

}

function importar(txt){

  try{const b=m[1].replace(/-/g,'+').replace(/_/g,'/'); const json=decodeURIComponent(escape(atob(b))); const o=JSON.parse(json);

  const v=parseNum(el.value);
  if(el.dataset.lt==='rs0')liveMil(el);
  if(el.dataset.ft){const x=isNaN(v)?0:v; if(el.dataset.ft==='base')P().base=x; else if(el.dataset.ft==='desc')D.fut.desc[L.k]=x; else D.fut[el.dataset.ft]=x; save(); calc(); return}
  if(el.dataset.cf){D.loteCfg[L.onde==='direto'?'direto':'leilao'][el.dataset.cf]=isNaN(v)?0:(el.dataset.cf==='com'?v/100:v); save(); calc(); return}
  if(el.dataset.aj){if(isNaN(v))return; D[el.dataset.aj]=el.dataset.aj==='mm'?v/100:v; save(); calc(); return}
  if(!el.dataset.lt||isNaN(v))return;
  const key=el.id.slice(3), c=D.cats[L.k]; L[key]=v; if(key==='dc')L.dcEdit=true;
  const fc=fcOf(c,L.p0)||1; if(key==='lance')L.cu=v/fc; if(key==='cu')L.lance=v*fc; if(key==='p0'){if(L.onde==='direto')L.lance=L.cu*fc; else L.cu=L.lance/fc}
  save(); calc();
});
document.addEventListener('change',e=>{if(e.target.id==='lt_k'){fill(+e.target.value); save(); build()}});
document.addEventListener('focusin',e=>{const t=e.target; if(t.tagName==='INPUT'&&t.type!=='date')setTimeout(()=>{try{t.select()}catch(_){}} ,0)});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('demo')){L.demo=e.target.open; save()}},true);
document.addEventListener('click',e=>{const t=e.target;
  const pb=t.closest('#segPraca button'); if(pb){D.praca=pb.dataset.v; const c=D.cats[L.k], pr=P().cats[L.k]||{}; L.cu=pr.cu; L.venda=pr.venda; L.lance=Math.round(L.cu*fcOf(c,L.p0)); if(c.bez&&pr.bp!=null)L.bpreco=pr.bp; L.dcEdit=false; save(); build(); return}
  const ob=t.closest('#ltOnde button'); if(ob){L.onde=ob.dataset.v; cfEdit=false; save(); build(); return}
  const mb=t.closest('#ltModo button'); if(mb){L.modo=mb.dataset.v; save(); build(); return}
  if(t.id==='ltCfEdit'){cfEdit=true; cfRender(); return}
  if(t.id==='ltCfOk'){cfEdit=false; cfRender(); calc(); return}
  if(t.id==='impPaste'){(navigator.clipboard&&navigator.clipboard.readText?navigator.clipboard.readText():Promise.reject()).then(x=>{document.getElementById('impTxt').value=x;document.getElementById('impOk').click()}).catch(()=>{const el=document.getElementById('impMsg'); el.textContent='Toque na caixa, segure e escolha “Colar”.'; el.className='msg bad'}); return}
  if(t.id==='impOk'){const m=importar(document.getElementById('impTxt').value); const el=document.getElementById('impMsg');
    if(m){el.innerHTML=m; el.className='msg bad'} else {const e2=document.getElementById('impMsg'); if(e2){e2.textContent='Atualizado!'; e2.className='msg good'} document.getElementById('dadosInfo').scrollIntoView()}}
});
build();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
